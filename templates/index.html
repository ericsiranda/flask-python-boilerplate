<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Editor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <h1 class="text-xl font-bold">AI Video Editor</h1>
        </div>
        <button onclick="alert('Login Instagram akan segera hadir!')" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white text-sm font-semibold py-2 px-4 rounded-lg">
            Login Instagram
        </button>
    </nav>

    <main class="max-w-4xl mx-auto p-6 space-y-6">

        <!-- Upload Card -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h2 class="text-lg font-bold mb-4 text-blue-400">1. Upload Video Mentah</h2>
            <input type="file" id="videoInput" accept="video/*" class="w-full text-sm text-gray-400 mb-4 bg-gray-700 rounded-lg p-2"/>
            <button type="button" onclick="uploadVideo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">
                Upload ke Vercel Blob
            </button>
            <div id="uploadStatus" class="mt-4 text-center text-sm p-3 rounded-lg bg-gray-700/50 hidden"></div>
        </div>

        <!-- Report Table -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h2 class="text-lg font-bold mb-4 text-yellow-400">4. Report & Review</h2>
            <table class="w-full text-sm text-left text-gray-400">
                <thead class="text-xs uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-4 py-3 rounded-l-lg">Nama File</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3 rounded-r-lg">Ukuran</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td class="px-4 py-3 text-gray-500 italic" colspan="3">Belum ada data upload.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        async function uploadVideo() {
            console.log("=== TOMBOL UPLOAD DIKLIK ===");
            
            const fileInput = document.getElementById('videoInput');
            const statusDiv = document.getElementById('uploadStatus');
            const file = fileInput.files[0];

            statusDiv.classList.remove('hidden');

            if (!file) {
                statusDiv.innerHTML = '<span class="text-yellow-400">⚠️ Silakan pilih video terlebih dahulu.</span>';
                return;
            }

            console.log("File dipilih:", file.name, "Ukuran:", file.size);

            statusDiv.innerHTML = '<span class="text-blue-400">📤 Mengunggah video... (mohon tunggu)</span>';

            try {
                const formData = new FormData();
                formData.append('video', file);

                console.log("Mengirim request ke /api/upload...");
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                console.log("Response status:", response.status);
                const data = await response.json();
                console.log("Response data:", data);
                
                if (!response.ok) throw new Error(data.error || 'Gagal upload');
                
                // Update status
                statusDiv.innerHTML = '<span class="text-green-400">✅ Berhasil diunggah!</span>';

                // Isi tabel report
                const tableBody = document.getElementById('reportTableBody');
                tableBody.innerHTML = `
                    <tr class="border-b border-gray-700">
                        <td class="px-4 py-3 text-white">${data.filename}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded-full bg-blue-500/20 text-blue-400">Menunggu Prompt</span></td>
                        <td class="px-4 py-3">${(data.size / 1024 / 1024).toFixed(2)} MB</td>
                    </tr>
                `;

                console.log("=== SELESAI ===");

            } catch (error) {
                console.error("ERROR:", error);
                statusDiv.innerHTML = `<span class="text-red-400">❌ Error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
