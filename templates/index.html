<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Editor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <!-- Navbar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <h1 class="text-xl font-bold">AI Video Editor</h1>
        </div>
        <button onclick="alert('Login Instagram akan segera hadir!')" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white text-sm font-semibold py-2 px-4 rounded-lg">
            Login Instagram
        </button>
    </nav>

    <main class="max-w-4xl mx-auto p-6 space-y-6">

        <!-- Upload Card -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <h2 class="text-lg font-bold mb-4 text-blue-400">1. Upload Video Mentah</h2>
            <input type="file" id="videoInput" accept="video/*" class="w-full text-sm text-gray-400 mb-4 bg-gray-700 rounded-lg p-2"/>
            <button type="button" onclick="uploadVideo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg">
                Upload ke Vercel Blob
            </button>
            <div id="uploadStatus" class="mt-4 text-center text-sm p-3 rounded-lg bg-gray-700/50 hidden"></div>
        </div>

        <!-- Report Table -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-yellow-400">4. Report & Review</h2>
                <button onclick="loadFiles()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg">
                    🔄 Refresh
                </button>
            </div>
            <table class="w-full text-sm text-left text-gray-400">
                <thead class="text-xs uppercase bg-gray-700/50">
                    <tr>
                        <th class="px-4 py-3 rounded-l-lg">Nama File</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3">Ukuran</th>
                        <th class="px-4 py-3 rounded-r-lg">Aksi</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    <tr>
                        <td class="px-4 py-3 text-gray-500 italic" colspan="4">Memuat data...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        // ==================== LOAD FILES SAAT HALAMAN DIBUKA ====================
        window.addEventListener('DOMContentLoaded', function() {
            console.log("Halaman dimuat, memuat daftar file...");
            loadFiles();
        });

        async function loadFiles() {
            const tableBody = document.getElementById('reportTableBody');
            tableBody.innerHTML = '<tr><td class="px-4 py-3 text-gray-500 italic" colspan="4">Memuat data...</td></tr>';
            
            try {
                console.log("Mengambil data dari /api/list-files...");
                const response = await fetch('/api/list-files');
                const data = await response.json();
                
                console.log("Data diterima:", data);
                
                if (!response.ok) throw new Error(data.error || 'Gagal mengambil data');
                
                tableBody.innerHTML = '';
                
                if (!data.files || data.files.length === 0) {
                    tableBody.innerHTML = '<tr><td class="px-4 py-3 text-gray-500 italic" colspan="4">Belum ada data upload.</td></tr>';
                    return;
                }
                
                data.files.forEach(function(file) {
                    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                    
                    const row = document.createElement('tr');
                    row.className = 'border-b border-gray-700 hover:bg-gray-700/30 transition';
                    row.innerHTML = `
                        <td class="px-4 py-3 text-white">${file.pathname}</td>
                        <td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded-full bg-blue-500/20 text-blue-400">Tersimpan</span></td>
                        <td class="px-4 py-3">${sizeMB} MB</td>
                        <td class="px-4 py-3"><a href="${file.url}" target="_blank" class="text-blue-400 hover:underline text-xs">Buka</a></td>
                    `;
                    tableBody.appendChild(row);
                });
                
                console.log("Tabel berhasil diisi dengan " + data.files.length + " file.");
                
            } catch (error) {
                console.error("ERROR saat memuat file:", error);
                tableBody.innerHTML = `<tr><td class="px-4 py-3 text-red-400 italic" colspan="4">Gagal memuat data: ${error.message}</td></tr>`;
            }
        }

        // ==================== UPLOAD VIDEO ====================
        async function uploadVideo() {
            const fileInput = document.getElementById('videoInput');
            const statusDiv = document.getElementById('uploadStatus');
            const file = fileInput.files[0];

            statusDiv.classList.remove('hidden');

            if (!file) {
                statusDiv.innerHTML = '<span class="text-yellow-400">⚠️ Silakan pilih video terlebih dahulu.</span>';
                return;
            }

            statusDiv.innerHTML = '<span class="text-blue-400">📤 Mengunggah video... (mohon tunggu)</span>';

            try {
                const formData = new FormData();
                formData.append('video', file);

                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Gagal upload');
                
                statusDiv.innerHTML = '<span class="text-green-400">✅ Berhasil diunggah! Data akan dimuat ulang...</span>';

                // Setelah upload berhasil, panggil loadFiles() untuk refresh tabel
                setTimeout(function() {
                    loadFiles();
                }, 1000);

            } catch (error) {
                console.error("ERROR upload:", error);
                statusDiv.innerHTML = `<span class="text-red-400">❌ Error: ${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
