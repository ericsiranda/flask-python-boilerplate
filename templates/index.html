<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Editor Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }

        .chunk-loading-pulse {
            animation: chunkPulse 1.5s ease-in-out infinite;
        }
        @keyframes chunkPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* PENTING: Pastikan video menampilkan kontrol default browser */
        #groupedVideo {
            background: #000;
        }
        /* Paksa kontrol muncul di beberapa browser */
        #groupedVideo::-webkit-media-controls {
            display: flex !important;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">

    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-2 rounded-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </div>
            <h1 class="text-xl font-bold tracking-tight">AI Video Editor</h1>
        </div>
        <button onclick="alert('Fitur Login Instagram akan segera hadir!')" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white text-sm font-semibold py-2 px-4 rounded-lg">
            Login Instagram
        </button>
    </nav>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="lg:col-span-1 space-y-6">
            
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h2 class="text-lg font-bold mb-4 text-blue-400">1. Upload Video Mentah</h2>
                <div class="space-y-4">
                    <input type="file" id="videoInput" accept="video/*" 
                           class="w-full text-sm text-gray-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white cursor-pointer bg-gray-700 rounded-lg p-1"/>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" onclick="uploadCompressed()" 
                                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-3 rounded-lg text-xs">
                            🗜️ Kompres
                        </button>
                        <button type="button" onclick="uploadCut()" 
                                class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-3 rounded-lg text-xs">
                            ✂️ Potong
                        </button>
                    </div>
                    
                    <div class="w-full bg-gray-700 rounded-full h-2 hidden" id="progressContainer">
                        <div id="progressBar" class="bg-blue-500 h-2 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                    <div id="uploadStatus" class="text-center text-xs p-2 rounded-lg bg-gray-700/50 hidden"></div>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h2 class="text-lg font-bold mb-4 text-purple-400">2. Instruksi & Jadwal</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Prompt Edit Video</label>
                        <textarea id="promptInput" rows="3" placeholder="Contoh: Buat video ini cinematic..." 
                                  class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white outline-none resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-400 mb-1">Jadwal Upload ke Instagram</label>
                        <input type="datetime-local" id="scheduleInput" 
                               class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-sm text-white outline-none"/>
                    </div>
                    
                    <div id="selectedInfo" class="hidden text-xs p-3 rounded-lg bg-purple-500/20 border border-purple-500/40">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1 min-w-0">
                                <p class="text-purple-300 font-medium">📌 Terpilih untuk AI:</p>
                                <p id="selectedName" class="font-bold text-white break-words mt-1">-</p>
                            </div>
                            <button onclick="cancelSelection()" 
                                    class="ml-2 bg-red-500/30 hover:bg-red-500/50 text-red-200 text-xs px-2 py-1 rounded-lg flex-shrink-0">
                                ✕ Batal
                            </button>
                        </div>
                    </div>
                    
                    <button type="button" onclick="submitToAI()" 
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-4 rounded-lg text-sm">
                        🚀 Kirim ke AI untuk Edit
                    </button>
                    
                    <button type="button" onclick="resetAllStatus()" 
                            class="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 font-medium py-2 px-4 rounded-lg text-xs">
                        🔄 Reset Semua Status
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-6">
            
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h2 class="text-lg font-bold mb-4 text-green-400">3. Preview Video</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-gray-900 rounded-xl p-3 border border-gray-700">
                        <p class="text-xs text-gray-400 mb-2 font-semibold uppercase">Video Mentah</p>
                        <div id="rawVideoContainer" class="aspect-video bg-gray-800 rounded-lg flex items-center justify-center text-gray-600 text-sm overflow-hidden">
                            Klik "Preview" di tabel
                        </div>
                    </div>
                    <div class="bg-gray-900 rounded-xl p-3 border border-gray-700">
                        <p class="text-xs text-gray-400 mb-2 font-semibold uppercase flex items-center gap-2">
                            Hasil Edit AI
                            <span id="aiStatusBadge" class="hidden text-xs px-2 py-0.5 rounded-full"></span>
                        </p>
                        <div id="editedVideoContainer" class="aspect-video bg-gray-800 rounded-lg flex items-center justify-center text-gray-600 text-sm overflow-hidden">
                            Menunggu proses AI
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-yellow-400">4. Report & Review</h2>
                    <button onclick="loadFiles()" class="text-xs bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg">
                        🔄 Refresh
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-400">
                        <thead class="text-xs text-gray-500 uppercase bg-gray-700/50">
                            <tr>
                                <th class="px-4 py-3 rounded-l-lg">Nama File</th>
                                <th class="px-4 py-3">Status AI</th>
                                <th class="px-4 py-3">Ukuran</th>
                                <th class="px-4 py-3 rounded-r-lg">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody">
                            <tr><td class="px-4 py-3 text-gray-500 italic" colspan="4">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let selectedForAI = null;
        let aiStatusMap = {};

        window.addEventListener('DOMContentLoaded', function() {
            loadFiles();
        });

        // ==================== LOAD FILES ====================
        async function loadFiles() {
            const tableBody = document.getElementById('reportTableBody');
            tableBody.innerHTML = '<tr><td class="px-4 py-3 text-gray-500 italic" colspan="4">Memuat data...</td></tr>';
            
            try {
                const response = await fetch('/api/list-files-grouped');
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Gagal');
                
                tableBody.innerHTML = '';
                
                if (!data.files || data.files.length === 0) {
                    tableBody.innerHTML = '<tr><td class="px-4 py-3 text-gray-500 italic" colspan="4">Belum ada data upload.</td></tr>';
                    return;
                }
                
                data.files.forEach(function(file) {
                    const sizeMB = (file.size / 1024 / 1024).toFixed(2);
                    const row = document.createElement('tr');
                    row.className = 'border-b border-gray-700 hover:bg-gray-700/30';
                    
                    if (selectedForAI && selectedForAI.session_id === file.session_id) {
                        row.classList.add('bg-purple-900/30');
                    }
                    
                    let aiStatus = aiStatusMap[file.session_id] || file.ai_status || 'idle';
                    if (file.ai_result && file.ai_status === 'done') aiStatus = 'done';
                    
                    const statusBadge = renderAIStatusBadge(aiStatus);
                    
                    if (file.is_single) {
                        row.innerHTML = `
                            <td class="px-4 py-3 text-white">${file.pathname}</td>
                            <td class="px-4 py-3">${statusBadge}</td>
                            <td class="px-4 py-3">${sizeMB} MB</td>
                            <td class="px-4 py-3 flex gap-2 flex-wrap">
                                <button onclick='previewSingle("${file.url}", "${file.pathname}")' class="text-green-400 hover:underline text-xs">Preview</button>
                                <button onclick='selectForAI(${JSON.stringify({is_single: true, url: file.url, pathname: file.pathname, session_id: file.session_id || 'single_' + Date.now()})})' class="text-purple-400 hover:underline text-xs">Pilih AI</button>
                                <button onclick="deleteVideo('${file.url}', '${file.pathname}')" class="text-red-400 hover:underline text-xs">Hapus</button>
                            </td>
                        `;
                    } else {
                        const chunksJson = JSON.stringify(file.chunks).replace(/"/g, '&quot;');
                        row.innerHTML = `
                            <td class="px-4 py-3 text-white">
                                ${file.pathname}
                                <div class="text-xs text-gray-500">${file.total_chunks} potongan</div>
                            </td>
                            <td class="px-4 py-3">${statusBadge}</td>
                            <td class="px-4 py-3">${sizeMB} MB</td>
                            <td class="px-4 py-3 flex gap-2 flex-wrap">
                                <button onclick='previewGrouped(${chunksJson}, "${file.session_id}")' class="text-green-400 hover:underline text-xs">Preview</button>
                                <button onclick='selectForAI(${JSON.stringify({is_single: false, session_id: file.session_id, chunks: file.chunks, pathname: file.pathname})})' class="text-purple-400 hover:underline text-xs">Pilih AI</button>
                                ${file.ai_result ? `<button onclick='previewAIResult(${JSON.stringify(file.ai_result).replace(/"/g, '&quot;')})' class="text-yellow-400 hover:underline text-xs">Lihat Hasil</button>` : ''}
                                <button onclick='deleteGrouped(${chunksJson}, "${file.session_id}")' class="text-red-400 hover:underline text-xs">Hapus</button>
                            </td>
                        `;
                    }
                    
                    tableBody.appendChild(row);
                });
                
            } catch (error) {
                tableBody.innerHTML = `<tr><td class="px-4 py-3 text-red-400 italic" colspan="4">Error: ${error.message}</td></tr>`;
            }
        }

        function renderAIStatusBadge(status) {
            switch(status) {
                case 'pending':
                    return '<span class="px-2 py-1 text-xs rounded-full bg-yellow-500/20 text-yellow-400">📋 Terpilih</span>';
                case 'processing':
                    return '<span class="px-2 py-1 text-xs rounded-full bg-orange-500/20 text-orange-400">⏳ Diproses</span>';
                case 'done':
                    return '<span class="px-2 py-1 text-xs rounded-full bg-green-500/20 text-green-400">✅ Selesai</span>';
                default:
                    return '<span class="px-2 py-1 text-xs rounded-full bg-gray-500/20 text-gray-400">- Belum</span>';
            }
        }

        // ==================== PREVIEW SINGLE ====================
        function previewSingle(fileUrl, pathname) {
            const container = document.getElementById('rawVideoContainer');
            container.innerHTML = `
                <video src="${fileUrl}" 
                       controls 
                       controlsList="nodownload noremoteplayback"
                       playsinline
                       preload="metadata" 
                       class="w-full h-full object-contain rounded-lg bg-black"></video>
            `;
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ==================== PREVIEW GROUPED (STREAMING BERTAHAP) ====================
        function previewGrouped(chunks, sessionId) {
            const container = document.getElementById('rawVideoContainer');
            
            const chunkStatus = chunks.map(() => 'pending');
            
            // Struktur: video di atas, info bar DI BAWAH (tidak menutupi kontrol video)
            container.innerHTML = `
                <div class="w-full h-full flex flex-col">
                    <!-- Video player -->
                    <div class="relative flex-1 bg-black rounded-lg overflow-hidden">
                        <video id="groupedVideo" 
                               controls 
                               controlsList="nodownload noremoteplayback"
                               playsinline
                               preload="auto" 
                               class="w-full h-full object-contain bg-black"
                               style="min-height: 200px;">
                        </video>
                        
                        <!-- Overlay loading untuk chunk pertama -->
                        <div id="firstLoadOverlay" 
                             class="absolute inset-0 bg-gray-900/95 flex flex-col items-center justify-center p-4 z-10"
                             style="pointer-events: auto;">
                            <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500/30 border-t-blue-500 mb-4"></div>
                            <div class="bg-yellow-500/20 border border-yellow-500/40 rounded-lg p-3 max-w-xs flex items-start gap-2 mb-3">
                                <svg class="w-5 h-5 text-yellow-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                                </svg>
                                <p class="text-xs text-yellow-200">
                                    <strong>Memuat...</strong> Video terdiri dari ${chunks.length} file, akan diputar otomatis.
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Info bar DI BAWAH video -->
                    <div class="mt-3 flex items-center gap-3 flex-wrap">
                        <div class="flex-1 min-w-[200px]">
                            <div class="bg-gray-700 rounded-full h-1.5">
                                <div id="loadProgress" class="bg-green-500 h-1.5 rounded-full transition-all" style="width: 0%"></div>
                            </div>
                            <div class="flex justify-between mt-1">
                                <p class="text-xs text-gray-400">
                                    🎬 Potongan <span id="currentChunkLabel" class="text-white font-bold">-</span> / ${chunks.length}
                                </p>
                                <p class="text-xs text-gray-400">
                                    <span id="loadedCount">0</span> / ${chunks.length} siap
                                </p>
                            </div>
                        </div>
                        <div id="chunkStatusIndicator" class="text-xs text-blue-400 chunk-loading-pulse hidden">
                            ⏳ Memuat...
                        </div>
                    </div>
                </div>
            `;
            
            const video = document.getElementById('groupedVideo');
            const firstOverlay = document.getElementById('firstLoadOverlay');
            const loadProgress = document.getElementById('loadProgress');
            const loadedCountEl = document.getElementById('loadedCount');
            const currentChunkLabel = document.getElementById('currentChunkLabel');
            const statusIndicator = document.getElementById('chunkStatusIndicator');
            
            let currentIndex = 0;
            let loadedCount = 0;
            
            // PENTING: Set controls aktif
            video.controls = true;
            
            const updateLoadedProgress = () => {
                loadedCountEl.textContent = loadedCount;
                loadProgress.style.width = ((loadedCount / chunks.length) * 100) + '%';
            };
            
            const preloadOneChunk = (index) => {
                if (chunkStatus[index] === 'ready' || chunkStatus[index] === 'loading') return;
                chunkStatus[index] = 'loading';
                
                const tempVideo = document.createElement('video');
                tempVideo.preload = 'auto';
                tempVideo.muted = true;
                tempVideo.src = chunks[index].url;
                
                const finish = () => {
                    if (chunkStatus[index] !== 'ready') {
                        chunkStatus[index] = 'ready';
                        loadedCount++;
                        updateLoadedProgress();
                    }
                };
                
                const timeout = setTimeout(finish, 10000);
                
                tempVideo.onloadeddata = () => {
                    clearTimeout(timeout);
                    finish();
                };
                
                tempVideo.onerror = () => {
                    clearTimeout(timeout);
                    console.warn(`Chunk ${index} gagal preload`);
                    finish();
                };
            };
            
            const preloadAllInBackground = () => {
                for (let i = 0; i < chunks.length; i++) {
                    setTimeout(() => preloadOneChunk(i), i * 150);
                }
            };
            
            const playChunk = (index) => {
                if (index >= chunks.length) {
                    currentChunkLabel.textContent = '✓';
                    statusIndicator.classList.add('hidden');
                    return;
                }
                
                currentIndex = index;
                currentChunkLabel.textContent = index + 1;
                
                if (chunkStatus[index] !== 'ready') {
                    statusIndicator.classList.remove('hidden');
                    statusIndicator.textContent = `⏳ Memuat potongan ${index + 1}...`;
                    
                    const waitForReady = setInterval(() => {
                        if (chunkStatus[index] === 'ready') {
                            clearInterval(waitForReady);
                            statusIndicator.classList.add('hidden');
                            actuallyPlay(index);
                        }
                    }, 200);
                } else {
                    statusIndicator.classList.add('hidden');
                    actuallyPlay(index);
                }
            };
            
            const actuallyPlay = (index) => {
                // PENTING: Pastikan controls tetap true
                video.controls = true;
                
                video.src = chunks[index].url;
                video.load();
                
                // PENTING: Paksa controls kembali setelah metadata dimuat
                video.onloadedmetadata = () => {
                    video.controls = true;
                };
                
                video.play().catch(e => {
                    console.warn('Autoplay diblokir:', e);
                    // Jika autoplay diblokir, kontrol tetap terlihat untuk user klik manual
                });
            };
            
            video.addEventListener('ended', () => {
                if (currentIndex + 1 < chunks.length) {
                    playChunk(currentIndex + 1);
                }
            });
            
            const hideFirstOverlay = () => {
                firstOverlay.style.transition = 'opacity 0.5s';
                firstOverlay.style.opacity = '0';
                // PENTING: matikan pointer-events agar tidak block klik ke video
                firstOverlay.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    firstOverlay.remove();
                    playChunk(0);
                    preloadAllInBackground();
                }, 500);
            };
            
            // Tunggu chunk pertama siap
            chunkStatus[0] = 'loading';
            const firstVideo = document.createElement('video');
            firstVideo.preload = 'auto';
            firstVideo.muted = true;
            firstVideo.src = chunks[0].url;
            
            const firstLoadFinish = () => {
                if (chunkStatus[0] !== 'ready') {
                    chunkStatus[0] = 'ready';
                    loadedCount++;
                    updateLoadedProgress();
                    hideFirstOverlay();
                }
            };
            
            const firstTimeout = setTimeout(firstLoadFinish, 8000);
            firstVideo.onloadeddata = () => {
                clearTimeout(firstTimeout);
                firstLoadFinish();
            };
            firstVideo.onerror = () => {
                clearTimeout(firstTimeout);
                firstLoadFinish();
            };
            
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ==================== PREVIEW AI RESULT ====================
        function previewAIResult(aiResult) {
            const container = document.getElementById('editedVideoContainer');
            const badge = document.getElementById('aiStatusBadge');
            
            badge.className = 'text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-400';
            badge.textContent = '✅ Selesai';
            badge.classList.remove('hidden');
            
            container.innerHTML = `
                <video src="${aiResult.url}" 
                       controls 
                       controlsList="nodownload noremoteplayback"
                       playsinline
                       preload="metadata" 
                       class="w-full h-full object-contain rounded-lg bg-black"></video>
            `;
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // ==================== PILIH UNTUK AI ====================
        function selectForAI(data) {
            selectedForAI = data;
            const sessionId = data.session_id;
            aiStatusMap[sessionId] = 'pending';
            
            const infoDiv = document.getElementById('selectedInfo');
            const nameSpan = document.getElementById('selectedName');
            infoDiv.classList.remove('hidden');
            nameSpan.textContent = data.is_single 
                ? data.pathname 
                : `${data.pathname} (${data.chunks.length} potongan)`;
            
            loadFiles();
            
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = `<span class="text-yellow-400">📋 Video dipilih untuk AI</span>`;
            setTimeout(() => statusDiv.classList.add('hidden'), 2000);
        }

        // ==================== BATALKAN PILIHAN ====================
        function cancelSelection() {
            if (selectedForAI && aiStatusMap[selectedForAI.session_id] === 'pending') {
                delete aiStatusMap[selectedForAI.session_id];
            }
            
            selectedForAI = null;
            document.getElementById('selectedInfo').classList.add('hidden');
            document.getElementById('aiStatusBadge').classList.add('hidden');
            document.getElementById('editedVideoContainer').innerHTML = `
                <div class="text-center text-gray-600 text-sm">Menunggu proses AI</div>
            `;
            
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = `<span class="text-gray-400">✕ Pilihan dibatalkan</span>`;
            setTimeout(() => statusDiv.classList.add('hidden'), 2000);
            
            loadFiles();
        }

        // ==================== RESET SEMUA STATUS ====================
        async function resetAllStatus() {
            if (!confirm('Reset semua status AI?\n\n• Menghapus semua file hasil AI\n• Video mentah tetap aman\n\nLanjutkan?')) return;
            
            try {
                const response = await fetch('/api/reset-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                
                selectedForAI = null;
                aiStatusMap = {};
                
                document.getElementById('selectedInfo').classList.add('hidden');
                document.getElementById('aiStatusBadge').classList.add('hidden');
                document.getElementById('editedVideoContainer').innerHTML = `
                    <div class="text-center text-gray-600 text-sm">Menunggu proses AI</div>
                `;
                
                const statusDiv = document.getElementById('uploadStatus');
                statusDiv.classList.remove('hidden');
                statusDiv.innerHTML = `<span class="text-green-400">✅ Status di-reset. ${data.deleted} file hasil AI dihapus.</span>`;
                setTimeout(() => statusDiv.classList.add('hidden'), 3000);
                
                loadFiles();
            } catch (error) {
                alert(`❌ Gagal reset: ${error.message}`);
            }
        }

        // ==================== DELETE ====================
        async function deleteVideo(url, pathname) {
            if (!confirm(`Yakin ingin menghapus "${pathname}"?`)) return;
            try {
                const response = await fetch('/api/delete-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                if (!response.ok) throw new Error('Gagal hapus');
                alert('✅ File berhasil dihapus!');
                loadFiles();
            } catch (error) {
                alert(`❌ Gagal: ${error.message}`);
            }
        }

        async function deleteGrouped(chunks, sessionId) {
            if (!confirm(`Yakin ingin menghapus semua ${chunks.length} potongan dari sesi "${sessionId}"?`)) return;
            try {
                for (const chunk of chunks) {
                    await fetch('/api/delete-file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ url: chunk.url })
                    });
                }
                delete aiStatusMap[sessionId];
                if (selectedForAI && selectedForAI.session_id === sessionId) {
                    selectedForAI = null;
                    document.getElementById('selectedInfo').classList.add('hidden');
                }
                alert(`✅ ${chunks.length} potongan berhasil dihapus!`);
                loadFiles();
            } catch (error) {
                alert(`❌ Gagal: ${error.message}`);
            }
        }

        // ==================== KOMPRES ====================
        async function compressVideo(file, onProgress) {
            return new Promise(async (resolve, reject) => {
                try {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.muted = false;
                    video.playsInline = true;
                    
                    await new Promise((res, rej) => {
                        video.onloadedmetadata = res;
                        video.onerror = () => rej(new Error('Gagal memuat video'));
                    });

                    const canvas = document.createElement('canvas');
                    const targetWidth = 480;
                    const scale = Math.min(1, targetWidth / video.videoWidth);
                    canvas.width = Math.round(video.videoWidth * scale);
                    canvas.height = Math.round(video.videoHeight * scale);
                    const ctx = canvas.getContext('2d');

                    const canvasStream = canvas.captureStream(20);

                    let audioTrack = null;
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const source = audioCtx.createMediaElementSource(video);
                        const dest = audioCtx.createMediaStreamDestination();
                        source.connect(dest);
                        source.connect(audioCtx.destination);
                        audioTrack = dest.stream.getAudioTracks()[0];
                    } catch(e) {}

                    const tracks = [...canvasStream.getVideoTracks()];
                    if (audioTrack) tracks.push(audioTrack);
                    const outputStream = new MediaStream(tracks);
                    
                    let mimeType = 'video/webm;codecs=vp8,opus';
                    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

                    const recorder = new MediaRecorder(outputStream, {
                        mimeType: mimeType,
                        videoBitsPerSecond: 400000,
                        audioBitsPerSecond: 64000,
                    });

                    const chunks = [];
                    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(chunks, { type: 'video/webm' });
                        URL.revokeObjectURL(video.src);
                        resolve(blob);
                    };

                    video.play();
                    recorder.start(1000);

                    const drawFrame = () => {
                        if (video.paused || video.ended) {
                            setTimeout(() => {
                                if (recorder.state !== 'inactive') recorder.stop();
                            }, 500);
                            return;
                        }
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        if (onProgress && video.duration) {
                            onProgress((video.currentTime / video.duration) * 100);
                        }
                        requestAnimationFrame(drawFrame);
                    };
                    drawFrame();
                } catch (err) { reject(err); }
            });
        }

        // ==================== POTONG ====================
        async function cutVideo(file, chunkDurationSec, onProgress) {
            return new Promise(async (resolve, reject) => {
                try {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.muted = false;
                    video.playsInline = true;
                    
                    await new Promise((res, rej) => {
                        video.onloadedmetadata = res;
                        video.onerror = () => rej(new Error('Gagal memuat video'));
                    });

                    const totalDuration = video.duration;
                    const chunks = [];
                    let chunkIndex = 0;
                    const stream = video.captureStream();
                    
                    let audioTrack = null;
                    try {
                        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                        const source = audioCtx.createMediaElementSource(video);
                        const dest = audioCtx.createMediaStreamDestination();
                        source.connect(dest);
                        source.connect(audioCtx.destination);
                        audioTrack = dest.stream.getAudioTracks()[0];
                    } catch(e) {}

                    const tracks = [...stream.getVideoTracks()];
                    if (audioTrack) tracks.push(audioTrack);
                    const outputStream = new MediaStream(tracks);
                    
                    let mimeType = 'video/webm;codecs=vp8,opus';
                    if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

                    const recorder = new MediaRecorder(outputStream, {
                        mimeType: mimeType,
                        videoBitsPerSecond: 5000000,
                        audioBitsPerSecond: 128000,
                    });

                    let currentChunkChunks = [];
                    recorder.ondataavailable = (e) => { if (e.data.size > 0) currentChunkChunks.push(e.data); };
                    
                    recorder.onstop = () => {
                        const blob = new Blob(currentChunkChunks, { type: 'video/webm' });
                        chunks.push(blob);
                        currentChunkChunks = [];
                        chunkIndex++;
                        
                        if (onProgress) onProgress(Math.min(100, (video.currentTime / totalDuration) * 100), chunkIndex);
                        
                        if (!video.ended && video.currentTime < totalDuration) {
                            setTimeout(() => {
                                if (!video.ended) {
                                    recorder.start();
                                    setTimeout(() => {
                                        if (recorder.state === 'recording') recorder.stop();
                                    }, chunkDurationSec * 1000);
                                }
                            }, 100);
                        } else {
                            URL.revokeObjectURL(video.src);
                            resolve(chunks);
                        }
                    };

                    video.play();
                    recorder.start();
                    
                    setTimeout(() => {
                        if (recorder.state === 'recording') recorder.stop();
                    }, chunkDurationSec * 1000);
                } catch (err) { reject(err); }
            });
        }

        // ==================== UPLOAD KOMPRES ====================
        async function uploadCompressed() {
            const fileInput = document.getElementById('videoInput');
            const statusDiv = document.getElementById('uploadStatus');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const file = fileInput.files[0];

            statusDiv.classList.remove('hidden');
            if (!file) { statusDiv.innerHTML = '<span class="text-yellow-400">⚠️ Pilih video dulu.</span>'; return; }

            const originalSizeMB = file.size / 1024 / 1024;
            let fileToUpload = file;

            if (originalSizeMB > 3) {
                statusDiv.innerHTML = `<span class="text-blue-400">🗜️ Mengompres (${originalSizeMB.toFixed(2)} MB)...</span>`;
                progressContainer.classList.remove('hidden');
                progressBar.style.width = '0%';
                progressBar.style.background = '#f59e0b';

                try {
                    const compressedBlob = await compressVideo(file, (percent) => {
                        progressBar.style.width = percent.toFixed(0) + '%';
                        statusDiv.innerHTML = `<span class="text-blue-400">🗜️ Mengompres... ${percent.toFixed(0)}%</span>`;
                    });
                    
                    const compressedSizeMB = compressedBlob.size / 1024 / 1024;
                    statusDiv.innerHTML = `<span class="text-green-400">✅ Kompresi: ${originalSizeMB.toFixed(2)} → ${compressedSizeMB.toFixed(2)} MB</span>`;
                    
                    if (compressedSizeMB > 4) {
                        statusDiv.innerHTML = `<span class="text-red-400">❌ Hasil ${compressedSizeMB.toFixed(2)} MB. Coba "Potong".</span>`;
                        progressContainer.classList.add('hidden');
                        return;
                    }
                    fileToUpload = new File([compressedBlob], file.name.replace(/\.[^.]+$/, '.webm'), { type: 'video/webm' });
                    progressBar.style.width = '80%';
                } catch (err) {
                    statusDiv.innerHTML = `<span class="text-red-400">❌ ${err.message}</span>`;
                    progressContainer.classList.add('hidden');
                    return;
                }
            }

            statusDiv.innerHTML = `<span class="text-blue-400">📤 Mengunggah...</span>`;
            progressBar.style.width = '90%';

            try {
                const formData = new FormData();
                formData.append('video', fileToUpload);
                const response = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                
                progressBar.style.width = '100%';
                progressBar.style.background = '#10b981';
                statusDiv.innerHTML = '<span class="text-green-400">✅ Berhasil!</span>';
                setTimeout(() => { loadFiles(); statusDiv.classList.add('hidden'); progressContainer.classList.add('hidden'); }, 1500);
            } catch (error) {
                statusDiv.innerHTML = `<span class="text-red-400">❌ ${error.message}</span>`;
                progressContainer.classList.add('hidden');
            }
        }

        // ==================== UPLOAD POTONG ====================
        async function uploadCut() {
            const fileInput = document.getElementById('videoInput');
            const statusDiv = document.getElementById('uploadStatus');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const file = fileInput.files[0];

            statusDiv.classList.remove('hidden');
            if (!file) { statusDiv.innerHTML = '<span class="text-yellow-400">⚠️ Pilih video dulu.</span>'; return; }

            const originalSizeMB = file.size / 1024 / 1024;
            const sessionId = Date.now().toString(36);

            statusDiv.innerHTML = `<span class="text-purple-400">✂️ Memotong (${originalSizeMB.toFixed(2)} MB)...</span>`;
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressBar.style.background = '#a855f7';

            try {
                const chunks = await cutVideo(file, 10, (percent, idx) => {
                    progressBar.style.width = percent.toFixed(0) + '%';
                    statusDiv.innerHTML = `<span class="text-purple-400">✂️ Memotong... ${percent.toFixed(0)}% (potongan ${idx})</span>`;
                });

                progressBar.style.width = '50%';
                let uploadedCount = 0;
                for (let i = 0; i < chunks.length; i++) {
                    const chunkFile = new File([chunks[i]], `cut_${sessionId}_${i}.webm`, { type: 'video/webm' });
                    const formData = new FormData();
                    formData.append('video', chunkFile);
                    formData.append('session_id', sessionId);
                    formData.append('chunk_index', i);
                    
                    const response = await fetch('/api/upload-chunk', { method: 'POST', body: formData });
                    if (!response.ok) throw new Error(`Chunk ${i} gagal`);
                    
                    uploadedCount++;
                    progressBar.style.width = (50 + (uploadedCount / chunks.length) * 50).toFixed(0) + '%';
                    statusDiv.innerHTML = `<span class="text-blue-400">📤 Upload ${uploadedCount}/${chunks.length}...</span>`;
                }

                await fetch('/api/finalize-cut', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, total_chunks: chunks.length, original_name: file.name })
                });

                progressBar.style.width = '100%';
                progressBar.style.background = '#10b981';
                statusDiv.innerHTML = `<span class="text-green-400">✅ ${chunks.length} potongan berhasil!</span>`;
                setTimeout(() => { loadFiles(); statusDiv.classList.add('hidden'); progressContainer.classList.add('hidden'); }, 1500);
            } catch (error) {
                statusDiv.innerHTML = `<span class="text-red-400">❌ ${error.message}</span>`;
                progressContainer.classList.add('hidden');
            }
        }

        // ==================== SUBMIT TO AI ====================
        async function submitToAI() {
            const prompt = document.getElementById('promptInput').value;
            const schedule = document.getElementById('scheduleInput').value;

            if (!prompt) { alert('Isi prompt dulu!'); return; }
            if (!selectedForAI) { alert('Pilih video dulu (klik "Pilih AI" di tabel)!'); return; }

            const sessionId = selectedForAI.session_id;
            aiStatusMap[sessionId] = 'processing';
            
            const badge = document.getElementById('aiStatusBadge');
            badge.className = 'text-xs px-2 py-0.5 rounded-full bg-orange-500/20 text-orange-400';
            badge.textContent = '⏳ Memproses...';
            badge.classList.remove('hidden');
            
            document.getElementById('editedVideoContainer').innerHTML = `
                <div class="text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-orange-400 mx-auto mb-2"></div>
                    <p class="text-xs text-orange-400">Memproses dengan AI...</p>
                </div>
            `;
            
            loadFiles();

            try {
                const payload = {
                    prompt: prompt,
                    schedule: schedule,
                    is_single: selectedForAI.is_single,
                    single_url: selectedForAI.url || '',
                    session_id: sessionId,
                    chunks: selectedForAI.chunks || [],
                    pathname: selectedForAI.pathname,
                };

                const response = await fetch('/api/submit-to-ai', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                aiStatusMap[sessionId] = 'done';
                
                badge.className = 'text-xs px-2 py-0.5 rounded-full bg-green-500/20 text-green-400';
                badge.textContent = '✅ Selesai';
                
                document.getElementById('editedVideoContainer').innerHTML = `
                    <video src="${data.ai_result.url}" 
                           controls 
                           controlsList="nodownload noremoteplayback"
                           playsinline
                           preload="metadata" 
                           class="w-full h-full object-contain rounded-lg bg-black"></video>
                `;
                
                loadFiles();
                
            } catch (error) {
                aiStatusMap[sessionId] = 'pending';
                badge.className = 'text-xs px-2 py-0.5 rounded-full bg-red-500/20 text-red-400';
                badge.textContent = '❌ Gagal';
                
                document.getElementById('editedVideoContainer').innerHTML = `
                    <div class="text-center text-red-400 text-sm p-4">
                        ❌ Error: ${error.message}
                    </div>
                `;
                loadFiles();
            }
        }
    </script>
